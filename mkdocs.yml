site_name: Authority
site_url: https://rkriad585.github.io/authority/
site_description: Comprehensive, framework-agnostic Python authentication library.
repo_url: https://github.com/rkriad585/authority
edit_uri: blob/main/docs/

theme:
  name: material
  logo: https://raw.githubusercontent.com/rkriad585/authority/main/logo/logo.svg
  favicon: https://raw.githubusercontent.com/rkriad585/authority/main/logo/logo.svg
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Screenshots: screenshots.md
  - Development: development.md
  - Deployment: deployment.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Examples:
      - Overview: examples/index.md
      - Flask: examples/flask.md
      - Django: examples/django.md
      - WSGI Middleware: examples/wsgi.md
      - FastAPI: examples/fastapi.md
      - Starlette: examples/starlette.md
      - ASGI Middleware: examples/asgi.md

strict: true
